<style>
        .scanner-frame {
            position: relative;
            width: 100%;
            height: 100%;
            border: 2px solid theme('colors.primary');
        }
        
        .scanner-frame::before,
        .scanner-frame::after,
        .scanner-frame-inner::before,
        .scanner-frame-inner::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: theme('colors.primary');
            border-style: solid;
        }

        .scanner-frame::before { top: -2px; left: -2px; border-width: 4px 0 0 4px; }
        .scanner-frame::after { top: -2px; right: -2px; border-width: 4px 4px 0 0; }
        .scanner-frame-inner::before { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; }
        .scanner-frame-inner::after { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; }
      </style>
