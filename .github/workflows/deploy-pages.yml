# ============================================================
# DIGIELECT — Despliegue de la demo estática a GitHub Pages
#
# GitHub Pages solo sirve archivos estáticos, por lo que este
# workflow construye la exportación estática de Next.js en
# MODO DEMO (sin rutas de API, sin base de datos):
#  · Los datos reales se sirven desde /public/data/*.json
#    (generados con `bun run demo:export` y versionados).
#  · Las mutaciones del visitante se guardan en localStorage.
#  · El análisis de visión (VLM) se simula localmente y así se
#    indica en la interfaz. El modo completo requiere el backend
#    Next.js (ver README).
#
# La primera vez hay que habilitar Pages:
#  Settings → Pages → Build and deployment → Source: GitHub Actions
# ============================================================

name: "Deploy demo a GitHub Pages"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # [OLA6 6.3] toolchain pineada = local (bun --version)

      - name: "Instalar dependencias"
        run: bun install --frozen-lockfile

      # [OLA6 6.1] Quality gates ANTES de construir/desplegar: el job
      # deploy depende de este job, así que un error de tsc o lint
      # corta el pipeline sin subir nada a Pages.
      - name: "Quality gates (tsc + lint)"
        run: |
          bunx tsc --noEmit
          bun run lint

      # [OLA6 6.1] El build estático de abajo ES el tercer gate: si falla,
      # no se sube artefacto y el job deploy (needs: build) no corre.
      # El trigger pull_request corre los mismos gates en PRs a main.
      - name: "Build estático (modo demo sin backend)"
        env:
          NEXT_STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: "/digielect"
        run: |
          bun run build:static

      - name: "Subir artefacto"
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Desplegar en GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
